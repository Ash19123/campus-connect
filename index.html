<!DOCTYPE html>
<html>

<head>
  <title>Campus Connect – Amrita Vishwa Vidyapeetham</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ── THEME VARIABLES ── */
    :root {
      --maroon: #6B0F1A;
      --maroon-dark: #4A0A12;
      --maroon-deep: #2D0609;
      --maroon-light: #8B1A28;
      --maroon-soft: #B5293A;
      --maroon-muted: #F5E8EA;
      --maroon-tint: #FDF2F3;
      --gold: #C9A84C;
      --gold-light: #E2C675;
      --gold-pale: #FBF5E0;
      --cream: #FAF7F2;
      --white: #FFFFFF;
      --text-dark: #1A0608;
      --text-mid: #4A2228;
      --text-soft: #7A4850;
      --text-muted: #A87880;
      --border: rgba(107, 15, 26, 0.12);
      --border-mid: rgba(107, 15, 26, 0.22);
      --shadow-sm: 0 4px 12px rgba(107, 15, 26, 0.06);
      --shadow-md: 0 8px 30px rgba(107, 15, 26, 0.1);
      --shadow-lg: 0 20px 60px rgba(107, 15, 26, 0.15);
      --sidebar-bg: #2D0609;
      --sidebar-text: rgba(255, 255, 255, 0.7);
      --sidebar-active-bg: rgba(201, 168, 76, 0.15);
      --card-bg: #FFFFFF;
      --page-bg: #FAF7F2;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --maroon: #E05060;
      --maroon-dark: #C03040;
      --maroon-deep: #1A0608;
      --maroon-light: #FF6070;
      --maroon-soft: #FF4055;
      --maroon-muted: #2A1218;
      --maroon-tint: #1E0D10;
      --gold: #E2C675;
      --gold-light: #F0D890;
      --gold-pale: #2A2210;
      --cream: #0F0608;
      --white: #1A0B0E;
      --text-dark: #F5E8EA;
      --text-mid: #D0A0A8;
      --text-soft: #B08088;
      --text-muted: #806068;
      --border: rgba(229, 80, 96, 0.18);
      --border-mid: rgba(229, 80, 96, 0.28);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
      --sidebar-bg: #0F0305;
      --sidebar-text: rgba(255, 255, 255, 0.6);
      --sidebar-active-bg: rgba(226, 198, 117, 0.12);
      --card-bg: #1A0B0E;
      --page-bg: #0F0608;
    }

    [data-theme="ocean"] {
      --maroon: #006699;
      --maroon-dark: #004466;
      --maroon-deep: #002233;
      --maroon-light: #3399CC;
      --maroon-soft: #0077B3;
      --maroon-muted: #E6F2F9;
      --maroon-tint: #F0F8FF;
      --gold: #00BFFF;
      --gold-light: #80DFFF;
      --gold-pale: #E6FAFF;
      --cream: #F0F8FF;
      --white: #FFFFFF;
      --text-dark: #00111A;
      --text-mid: #00334D;
      --text-soft: #005580;
      --text-muted: #6699B3;
      --border: rgba(0, 102, 153, 0.12);
      --border-mid: rgba(0, 102, 153, 0.22);
      --sidebar-bg: #002233;
      --sidebar-text: rgba(255, 255, 255, 0.7);
      --sidebar-active-bg: rgba(0, 191, 255, 0.15);
      --card-bg: #FFFFFF;
      --page-bg: #F0F8FF;
    }

    [data-theme="nature"] {
      --maroon: #2E5C31;
      --maroon-dark: #1F3D21;
      --maroon-deep: #0F1F10;
      --maroon-light: #4A934E;
      --maroon-soft: #3B753E;
      --maroon-muted: #EBF2EC;
      --maroon-tint: #F4F8F4;
      --gold: #F4A261;
      --gold-light: #F8C59F;
      --gold-pale: #FEF6F0;
      --cream: #FAFBF9;
      --white: #FFFFFF;
      --text-dark: #0A140B;
      --text-mid: #1A331C;
      --text-soft: #29522D;
      --text-muted: #6B8E6F;
      --border: rgba(46, 92, 49, 0.12);
      --border-mid: rgba(46, 92, 49, 0.22);
      --sidebar-bg: #0F1F10;
      --sidebar-text: rgba(255, 255, 255, 0.7);
      --sidebar-active-bg: rgba(244, 162, 97, 0.15);
      --card-bg: #FFFFFF;
      --page-bg: #FAFBF9;
    }

    [data-theme="sunset"] {
      --maroon: #E05A47;
      --maroon-dark: #B33D2D;
      --maroon-deep: #591A12;
      --maroon-light: #F08E81;
      --maroon-soft: #E87160;
      --maroon-muted: #FCEFEB;
      --maroon-tint: #FEF7F5;
      --gold: #FFB347;
      --gold-light: #FFD199;
      --gold-pale: #FFF7EB;
      --cream: #FEFCFA;
      --white: #FFFFFF;
      --text-dark: #2B0C08;
      --text-mid: #591A12;
      --text-soft: #8C2C1F;
      --text-muted: #B3685E;
      --border: rgba(224, 90, 71, 0.12);
      --border-mid: rgba(224, 90, 71, 0.22);
      --sidebar-bg: #3D120C;
      --sidebar-text: rgba(255, 255, 255, 0.7);
      --sidebar-active-bg: rgba(255, 179, 71, 0.15);
      --card-bg: #FFFFFF;
      --page-bg: #FEFCFA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--page-bg);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s, color 0.4s;
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #2D0609 0%, #6B0F1A 50%, #B5293A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(201, 168, 76, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: splashPulse 2s ease-in-out infinite;
      margin-bottom: 1.5rem;
    }

    .splash-logo-ring .logo-inner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(201, 168, 76, 0.15);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    .splash-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: #fff;
      letter-spacing: -0.5px;
      text-align: center;
    }

    .splash-sub {
      color: rgba(226, 198, 117, 0.8);
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-top: 0.4rem;
      font-weight: 500;
    }

    .splash-bar {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      margin-top: 2.5rem;
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      animation: splashLoad 2s ease forwards;
    }

    .splash-tagline {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      margin-top: 1rem;
      letter-spacing: 0.5px;
    }

    @keyframes splashPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1
      }

      50% {
        transform: scale(1.05);
        opacity: 0.8
      }
    }

    @keyframes splashLoad {
      0% {
        width: 0
      }

      100% {
        width: 100%
      }
    }

    /* ── PAGE STRUCTURE ── */
    .page {
      display: none;
      min-height: 100vh;
    }

    .page.active {
      display: flex;
      flex-direction: column;
    }

    #page-app {
      flex-direction: row;
    }

    /* ── AUTH ── */
    #page-auth {
      background: linear-gradient(135deg, var(--maroon-deep) 0%, var(--maroon) 55%, var(--maroon-soft) 100%);
      position: relative;
      overflow: hidden;
    }

    #page-auth::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    }

    #page-auth::after {
      content: '';
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(201, 168, 76, 0.06);
    }

    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeDown 0.7s ease both;
    }

    .auth-logo .logo-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2.2rem;
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.2);
    }

    .auth-logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .auth-logo p {
      color: var(--gold-light);
      font-size: 0.78rem;
      margin-top: 0.3rem;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .auth-card {
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 430px;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.7s ease 0.2s both;
      border: 1px solid var(--border);
    }

    .auth-tabs {
      display: flex;
      background: var(--maroon-tint);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 2rem;
    }

    .auth-tab {
      flex: 1;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      border-radius: calc(var(--radius-md) - 2px);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-soft);
      transition: var(--transition);
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
    }

    .auth-tab.active {
      background: var(--maroon);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-mid);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dark);
      background: var(--card-bg);
      outline: none;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--maroon);
      box-shadow: 0 0 0 3px rgba(107, 15, 26, 0.08);
    }

    .interests-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.4rem;
    }

    .interest-chip {
      padding: 0.4rem 0.5rem;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
      color: var(--text-soft);
      font-weight: 500;
    }

    .interest-chip.selected {
      background: var(--maroon);
      color: white;
      border-color: var(--maroon);
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: var(--maroon);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      letter-spacing: 0.3px;
    }

    .btn-primary:hover {
      background: var(--maroon-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* ── TRANSITION OVERLAY ── */
    #login-transition {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: linear-gradient(135deg, #2D0609, #6B0F1A);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #login-transition.show {
      opacity: 1;
      pointer-events: all;
    }

    .lt-logo {
      font-size: 4rem;
      animation: ltPop 0.6s ease;
    }

    .lt-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #fff;
      margin-top: 1rem;
      animation: fadeUp 0.6s ease 0.2s both;
    }

    .lt-sub {
      color: var(--gold-light);
      font-size: 0.9rem;
      margin-top: 0.5rem;
      animation: fadeUp 0.6s ease 0.4s both;
    }

    .lt-dots {
      display: flex;
      gap: 8px;
      margin-top: 2rem;
      animation: fadeUp 0.6s ease 0.5s both;
    }

    .lt-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: ltDots 1.2s ease infinite;
    }

    .lt-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .lt-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes ltPop {
      0% {
        transform: scale(0.5);
        opacity: 0
      }

      70% {
        transform: scale(1.1)
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    @keyframes ltDots {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.8)
      }

      50% {
        opacity: 1;
        transform: scale(1.2)
      }
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 264px;
      min-height: 100vh;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.closed {
      transform: translateX(-264px);
    }

    .sidebar-header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .brand-text h2 {
      font-family: 'Playfair Display', serif;
      color: white;
      font-size: 1.1rem;
      line-height: 1.1;
    }

    .brand-text p {
      color: var(--gold-light);
      font-size: 0.65rem;
      letter-spacing: 0.8px;
      margin-top: 2px;
      opacity: 0.8;
    }

    .sidebar-user {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--maroon-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      border: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-info .name {
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-info .roll {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.68rem;
      margin-top: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 0.75rem 0;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .sidebar-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-section-label {
      padding: 0.5rem 1.5rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1.5rem;
      cursor: pointer;
      color: var(--sidebar-text);
      font-size: 0.88rem;
      font-weight: 500;
      transition: var(--transition);
      border-left: 3px solid transparent;
      position: relative;
      user-select: none;
    }

    .nav-item:hover {
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active {
      color: white;
      background: var(--sidebar-active-bg);
      border-left-color: var(--gold);
    }

    .nav-item .nav-icon {
      font-size: 1rem;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .nav-item .badge {
      margin-left: auto;
      background: var(--maroon-soft);
      color: white;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 20px;
    }

    .sidebar-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.82rem;
      cursor: pointer;
      transition: var(--transition);
      background: none;
      border: none;
      font-family: 'DM Sans', sans-serif;
      flex: 1;
    }

    .logout-btn:hover {
      color: #FF6070;
    }

    .dark-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 20px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: var(--transition);
      color: white;
    }

    .dark-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 199;
    }

    .sidebar-overlay.show {
      display: block;
    }

    /* ── MAIN CONTENT ── */
    .main-content {
      margin-left: 264px;
      flex: 1;
      min-height: 100vh;
      background: var(--page-bg);
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .main-content.expanded {
      margin-left: 0;
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: var(--text-mid);
      transition: var(--transition);
      display: none;
    }

    .menu-btn:hover {
